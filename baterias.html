<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baterías - La Casa del Repuesto</title>
    
    <!-- SCRIPT ANTI-PARPADEO -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('selectedTheme');
        if (savedTheme && savedTheme !== 'light') {
          document.documentElement.classList.add('theme-' + savedTheme);
        }
      })();
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- VARIABLES BASE (MODO CLARO POR DEFECTO) --- */
        :root {
            --bg-body: #f4f6f9;
            --bg-card: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --bg-sidebar: #ffffff;
            --text-sidebar: #333333;
        }

        /* --- VARIABLES POR TEMA (Aplicadas a HTML) --- */
        html.theme-dark {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-color: #f5f5f5;
            --text-muted: #b0b0b0;
            --bg-sidebar: #1e1e1e;
            --text-sidebar: #ffffff;
        }

        html.theme-coffee {
            --bg-body: #2b1b17;
            --bg-card: #3e2723;
            --text-color: #efebe9;
            --text-muted: #d7ccc8;
            --bg-sidebar: #3e2723;
            --text-sidebar: #efebe9;
        }

        html.theme-blue {
            --bg-body: #1a2332;
            --bg-card: #243044;
            --text-color: #e6f1ff;
            --text-muted: #8892b0;
            --bg-sidebar: #243044;
            --text-sidebar: #ffffff;
        }

        /* ESTILOS DEL CUERPO (Ya no tienen colores fijos 'white') */
        body {
            background-color: var(--bg-body) !important;
            color: var(--text-color) !important;
            font-family: 'Arial', sans-serif;
            margin: 40px auto;
            max-width: 600px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        h1 {
            color: #d93838;
            text-align: center;
            font-size: 28px;
        }

        p {
            color: var(--text-muted);
        }

        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        /* TARJETAS DE PRODUCTO DENTRO DEL TEMA */
        .card-producto {
            background-color: var(--bg-card) !important;
            color: var(--text-color) !important;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-producto h4 {
            color: var(--text-color) !important;
        }

        .card-producto p {
            color: var(--text-muted) !important;
        }

        .card-producto img {
            width: 100%;
            height: 180px; 
            object-fit: contain; 
            background-color: #ffffff; 
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer; 
            padding: 5px;
            box-sizing: border-box;
        }

        .btn-agregar {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn-whatsapp {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 8px;
        }

        .btn-regresar {
            display: inline-block;
            background-color: #555;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 20px;
        }

        /* --- Lightbox --- */
        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .lightbox-overlay img {
            max-width: 90%;
            max-height: 90%;
            border: 3px solid white;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            cursor: default;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        /* --- BOTÓN FLOTANTE DEL MENÚ --- */
        .btn-sidebar-toggle {
          position: fixed;
          top: 15px;
          left: 15px;
          z-index: 999;
          background-color: var(--primary, #c1121f);
          color: white;
          border: none;
          font-size: 22px;
          padding: 8px 14px;
          border-radius: 8px;
          cursor: pointer;
          box-shadow: 0 4px 10px rgba(0,0,0,0.25);
          transition: transform 0.2s ease;
        }

        .btn-sidebar-toggle:hover {
          transform: scale(1.05);
        }

        /* --- PANEL LATERAL Y OVERLAY --- */
        .sidebar-overlay {
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(0,0,0,0.5);
          z-index: 1000;
          opacity: 0;
          visibility: hidden;
          transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .sidebar-overlay.active {
          opacity: 1;
          visibility: visible;
        }

        .sidebar-panel {
          position: fixed;
          top: 0;
          left: -300px;
          width: 280px;
          height: 100%;
          background-color: var(--bg-sidebar);
          color: var(--text-sidebar);
          z-index: 1001;
          box-shadow: 4px 0 15px rgba(0,0,0,0.3);
          transition: left 0.3s ease;
          display: flex;
          flex-direction: column;
        }

        .sidebar-panel.active {
          left: 0;
        }

        .sidebar-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 18px 20px;
          border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .sidebar-header h3 { margin: 0; font-size: 20px; }

        .btn-close {
          background: none; border: none; font-size: 28px;
          cursor: pointer; color: inherit;
        }

        .sidebar-content { padding: 20px; overflow-y: auto; }
        .sidebar-section h4 { margin-top: 0; font-size: 14px; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 15px 0; }
        .sidebar-menu li { margin-bottom: 12px; }
        .sidebar-menu a {
          text-decoration: none;
          color: inherit;
          font-weight: bold;
          font-size: 15px;
          display: block;
          padding: 8px 10px;
          border-radius: 6px;
          transition: background 0.2s;
        }

        .sidebar-menu a:hover { background: rgba(0,0,0,0.06); }
        .sidebar-divider { border: none; border-top: 1px solid rgba(0,0,0,0.1); margin: 20px 0; }

        /* Botones de Temas */
        .theme-subtitle { font-size: 13px; color: #888; margin-bottom: 10px; }
        .theme-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-theme {
          border: none;
          padding: 10px;
          border-radius: 6px;
          font-weight: bold;
          cursor: pointer;
          font-size: 13px;
          transition: opacity 0.2s;
        }

        .btn-theme:hover { opacity: 0.85; }
        .theme-light { background-color: #f4f6f8; color: #333; border: 1px solid #ccc; }
        .theme-dark { background-color: #1e1e1e; color: #fff; }
        .theme-coffee { background-color: #4a2822; color: #d7ccc8; }
        .theme-blue { background-color: #5073a9; color: #e3f2fd; }

        /* MODAL DEL CARRITO ADAPTADO */
        #modal-carrito > div {
          background-color: var(--bg-card) !important;
          color: var(--text-color) !important;
        }
    </style>
</head>
<body>

    <!-- Lightbox -->
    <div id="lightboxOverlay" class="lightbox-overlay" onclick="cerrarImagen()">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" src="" alt="Imagen en grande">
    </div>

    <h1>🔋 Baterías</h1>
    <p>Revisá nuestras opciones disponibles en inventario:</p>

    <div id="contenedorProductos" class="catalogo-grid">
        <p>Cargando productos...</p>
    </div>

    <a href="categorias.html" class="btn-regresar">← Volver a Categorías</a>

    <!-- BOTÓN FLOTANTE DEL CARRITO -->
    <div id="boton-carrito-flotante" onclick="document.getElementById('modal-carrito').style.display='block'" style="position:fixed; bottom:20px; right:20px; background:#e63946; color:#fff; padding:12px 20px; border-radius:50px; cursor:pointer; z-index:1000; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.3);">
      🛒 Carrito (<span id="cant-carrito">0</span>)
    </div>

    <!-- MODAL DEL CARRITO -->
    <div id="modal-carrito" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1001;">
      <div style="width:90%; max-width:400px; margin:100px auto; padding:20px; border-radius:8px; position:relative;">
        <span onclick="document.getElementById('modal-carrito').style.display='none'" style="position:absolute; right:15px; top:10px; cursor:pointer; font-size:20px; font-weight:bold;">&times;</span>
        
        <h2 style="margin-top:0;">Tu Pedido</h2>
        <hr style="margin-bottom:15px;">
        
        <div id="items-carrito"></div>
        
        <div style="margin-top:20px; text-align:right;">
          <strong>Total: <span id="total-carrito">Q0.00</span></strong>
        </div>

        <button onclick="enviarPedidoWhatsApp('50233775759')" style="width:100%; background:#25D366; color:#fff; border:none; padding:12px; margin-top:15px; border-radius:5px; font-weight:bold; cursor:pointer;">
          Pedir todo por WhatsApp
        </button>
      </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xcjrwstjhbgwgdpcqwmm.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_TGQTuTOiKITgHLHYoxA-MA_Bz9M94sv";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cargarbaterias() {
            const contenedor = document.getElementById('contenedorProductos');

            const { data: productos, error } = await db
                .from('productos')
                .select('*')
                .eq('categoria', 'baterias')
                .order('id', { ascending: false });

            if (error) {
                console.error("Error:", error);
                contenedor.innerHTML = "<p>Error al cargar inventario.</p>";
                return;
            }

            if (productos.length === 0) {
                contenedor.innerHTML = "<p>No hay productos registrados en este momento.</p>";
                return;
            }

            contenedor.innerHTML = "";

            productos.forEach(prod => {
                const mensajeWA = encodeURIComponent(`Hola, me interesa el producto: ${prod.nombre}`);
                const precioProd = prod.precio ? prod.precio : 0; 

                contenedor.innerHTML += `
                    <div class="card-producto">
                        <img src="${prod.imagen_url}" alt="${prod.nombre}" onclick="ampliarImagen('${prod.imagen_url}')">
                        <h4>${prod.nombre}</h4>
                        <p>${prod.descripcion || ''}</p>
                        <p><strong>Q${precioProd}</strong></p>
                        
                        <button class="btn-agregar" onclick="agregarAlCarrito(${prod.id}, '${prod.nombre}', ${precioProd}, '${prod.imagen_url}')">
                            Agregar al carrito
                        </button>

                        <a href="https://wa.me/50233775759?text=${mensajeWA}" class="btn-whatsapp" target="_blank">Consultar por WhatsApp</a>
                    </div>
                `;
            });
        }

        cargarbaterias();

        function ampliarImagen(url) {
            const overlay = document.getElementById('lightboxOverlay');
            const imgAmpliada = document.getElementById('lightboxImg');
            imgAmpliada.src = url;
            overlay.style.display = 'flex';
        }

        function cerrarImagen() {
            const overlay = document.getElementById('lightboxOverlay');
            overlay.style.display = 'none';
        }
    </script>
    
    <script src="carrito.js"></script>
<script src="sidebar.js"></script>


</body>
</html>
